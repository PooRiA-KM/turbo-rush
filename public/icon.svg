<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="car" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#cc0000"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Road -->
  <rect x="128" y="0" width="256" height="512" fill="url(#road)"/>
  
  <!-- Road edges -->
  <rect x="124" y="0" width="4" height="512" fill="#ffffff" opacity="0.8"/>
  <rect x="384" y="0" width="4" height="512" fill="#ffffff" opacity="0.8"/>
  
  <!-- Lane markings -->
  <rect x="190" y="50" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="190" y="130" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="190" y="210" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="190" y="290" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="190" y="370" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="190" y="450" width="6" height="40" fill="#ffdd00" rx="3"/>
  
  <rect x="316" y="50" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="316" y="130" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="316" y="210" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="316" y="290" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="316" y="370" width="6" height="40" fill="#ffdd00" rx="3"/>
  <rect x="316" y="450" width="6" height="40" fill="#ffdd00" rx="3"/>
  
  <!-- Player car (cyan) -->
  <g transform="translate(256, 350)">
    <!-- Car body -->
    <rect x="-25" y="-35" width="50" height="70" rx="10" fill="#00d4ff"/>
    <!-- Windshield -->
    <rect x="-18" y="-20" width="36" height="20" rx="5" fill="#1a1a2e" opacity="0.8"/>
    <!-- Headlights -->
    <circle cx="-15" cy="-30" r="4" fill="#ffff00"/>
    <circle cx="15" cy="-30" r="4" fill="#ffff00"/>
    <!-- Racing stripe -->
    <rect x="-3" y="-35" width="6" height="70" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Speed lines -->
  <line x1="160" y1="100" x2="160" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="350" y1="150" x2="350" y2="230" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="170" y1="250" x2="170" y2="310" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  
  <!-- Glow effect -->
  <circle cx="256" cy="350" r="60" fill="#00d4ff" opacity="0.1"/>
</svg>
