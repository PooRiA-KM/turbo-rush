<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="car-mask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg-mask)"/>
  
  <!-- Road -->
  <rect x="128" y="0" width="256" height="512" fill="#2d2d2d"/>
  
  <!-- Road edges -->
  <rect x="124" y="0" width="4" height="512" fill="#ffffff" opacity="0.9"/>
  <rect x="384" y="0" width="4" height="512" fill="#ffffff" opacity="0.9"/>
  
  <!-- Lane markings -->
  <rect x="190" y="40" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="190" y="110" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="190" y="180" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="190" y="250" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="190" y="320" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="190" y="390" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="190" y="460" width="6" height="35" fill="#ffdd00" rx="3"/>
  
  <rect x="316" y="40" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="316" y="110" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="316" y="180" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="316" y="250" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="316" y="320" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="316" y="390" width="6" height="35" fill="#ffdd00" rx="3"/>
  <rect x="316" y="460" width="6" height="35" fill="#ffdd00" rx="3"/>
  
  <!-- Player car (centered, larger for maskable) -->
  <g transform="translate(256, 280)">
    <!-- Car body -->
    <rect x="-35" y="-50" width="70" height="100" rx="14" fill="url(#car-mask)"/>
    <!-- Windshield -->
    <rect x="-25" y="-30" width="50" height="28" rx="7" fill="#1a1a2e" opacity="0.85"/>
    <!-- Headlights -->
    <ellipse cx="-20" cy="-42" rx="6" ry="5" fill="#ffff00"/>
    <ellipse cx="20" cy="-42" rx="6" ry="5" fill="#ffff00"/>
    <!-- Taillights -->
    <ellipse cx="-20" cy="42" rx="6" ry="4" fill="#ff3333"/>
    <ellipse cx="20" cy="42" rx="6" ry="4" fill="#ff3333"/>
    <!-- Racing stripe -->
    <rect x="-4" y="-50" width="8" height="100" fill="#ffffff" opacity="0.25"/>
    <!-- Side mirrors -->
    <rect x="-40" y="-15" width="8" height="12" rx="2" fill="#333"/>
    <rect x="32" y="-15" width="8" height="12" rx="2" fill="#333"/>
  </g>
  
  <!-- Glow effect -->
  <circle cx="256" cy="280" r="80" fill="#00d4ff" opacity="0.08"/>
</svg>
